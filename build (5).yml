          echo '{"appId":"com.kipa.app","appName":"Кипа","webDir":"www","server":{"cleartext":true},"android":{"allowMixedContent":true}}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kipa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kipa-apk
          path: kipa.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} kipa.apk --notes build
